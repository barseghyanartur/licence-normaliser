name: test_unstable

on:
  push:
  pull_request:
    types: [review_requested, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # *************************************
  # **************** Tests **************
  # *************************************
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15.0-alpha.5"]
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-codeblock
          pip install -e .

      - name: Run tests
        run: |
          # coverage's C extension (coverage.tracer) is not yet compatible
          # with this pre-release interpreter, so run without coverage
          # instrumentation here (see pyproject.toml addopts) and drop
          # pytest-cov from the deps above entirely.
          pytest -vrx -o addopts=""
